# Render.com blueprint — FREE tier (free web service + free managed PostgreSQL).
# Deploy: push this repo to GitHub, then in Render click "New +" -> "Blueprint" and point it
# at the repo. Render reads this file and provisions both the database and the web service.
#
# The Docker image is built for PostgreSQL (the Dockerfile swaps the Prisma provider at build
# time); on boot it runs `prisma db push` to create the tables, then auto-seeds the admin + plans.
#
# Notes on the free tier:
#  - The web service spins down after ~15 min idle and cold-starts on the next request (Meta
#    retries webhooks, so inbound still lands). Upgrade to a paid instance to stay always-on.
#  - Render's free PostgreSQL is time-limited (expires after the trial window) — fine for testing.
#    Swap `plan: free` on the database to a paid plan to keep it permanently.

databases:
  - name: orbit-db
    plan: free
    databaseName: orbit
    user: orbit

services:
  - type: web
    name: orbit-whatsapp
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DB_PROVIDER
        value: postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: orbit-db
          property: connectionString
      - key: META_GRAPH_API_VERSION
        value: v22.0
      # Secrets — set these in the Render dashboard (Environment tab). sync:false = not in git.
      - key: ENCRYPTION_KEY
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN_DEFAULT
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
